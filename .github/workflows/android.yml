name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Проверить версию
        run: |
          V=$(node -e 'console.log(require("./version.json").version)')
          grep -q "IT.VERSION = \"$V\"" js/version.js || { echo "::error::js/version.js не совпадает с version.json ($V)"; exit 1; }
          echo "VER=$V" >> "$GITHUB_ENV"

      - name: Подготовить Android-проект
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          bash native/prepare.sh

      - name: Собрать APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../Vamos.apk
          # обновление интерфейса «по воздуху» для уже установленных приложений
          cd ../www && zip -qr "../../web-$VER.zip" . && cd -
          ls -la ../../Vamos.apk ../../web-$VER.zip
          # подпись постоянным ключом
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs ../../Vamos.apk | tee /tmp/cert.txt | head -3
          grep -q "e558c86abeaf5e903430be25de63771f1c77c2a139346eb01fbe1ab6b06bbadd" /tmp/cert.txt || { echo "::error::APK подписан не тем ключом"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Vamos-apk
          path: Vamos.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "¡Vamos! — Android"
          body: |
            Скачайте **Vamos.apk** на телефон и откройте файл, чтобы установить.
            Дальше приложение обновляется само: при новой версии появится уведомление.
            Если Android спросит — разрешите установку из этого источника.
            Сборка: ${{ github.sha }}
          files: |
            Vamos.apk
            web-${{ env.VER }}.zip
          make_latest: true
