name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовить Android-проект
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          bash native/prepare.sh

      - name: Собрать APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../Vamos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vamos-apk
          path: Vamos.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "¡Vamos! — Android"
          body: |
            Скачайте **Vamos.apk** на телефон и откройте файл, чтобы установить.
            Если Android спросит — разрешите установку из этого источника.
            Сборка: ${{ github.sha }}
          files: Vamos.apk
          make_latest: true
